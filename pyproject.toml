[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-desk"
version = "0.1.0"
description = "Local-first invoice organizer and reimbursement sheet generator"
requires-python = ">=3.13"
dependencies = [
    "pywebview>=5,<7",
    "PyMuPDF>=1.28,<1.29",
    "openpyxl>=3.1,<4",
    "rapidocr-onnxruntime>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["ui/*.html", "ui/*.css", "ui/*.js", "ui/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["legacy", "tools"]
