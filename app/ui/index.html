<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>发票管家</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" v-cloak>
  <div v-if="loading" class="splash">
    <div class="spinner"></div>
    <div>正在打开发票库…</div>
  </div>

  <div v-else-if="fatal" class="splash fatal">
    <div class="fatal-title">无法打开发票库</div>
    <p>{{ fatal }}</p>
    <button class="btn primary" @click="load">重试</button>
  </div>

  <template v-else>
    <header class="topbar">
      <div class="brand">
        <span class="logo">票</span>
        <span class="brand-name">发票管家</span>
        <span class="version">v{{ boot.version }}</span>
      </div>
      <span class="spacer"></span>
      <div class="quick-actions">
        <button
          class="btn action wizard"
          @click="openWizard"
          :disabled="!!busy"
          title="按步骤完成本月报账：导入 → 核对 → 分类 → 生成报销单 → 导出"
        >
          <span class="action-icon">✓</span> 本月报账
        </button>
        <button
          class="btn action import"
          @click="openImportModal"
          :disabled="!!busy"
          title="导入发票文件夹（Ctrl+I）"
        >
          <span class="action-icon">↓</span> 导入发票
        </button>
        <div class="export-menu-wrap">
          <button
            class="btn action export export-main"
            @click="exportEvidence"
            :disabled="!!busy"
            title="一键导出证据包：Excel + 打印 PDF + 按公司/分类的 A4 二合一无标注 PDF"
          >
            <span class="action-icon">↑</span> 导出
          </button>
          <button
            class="btn action export export-caret"
            @click.stop="toggleExportMenu"
            :disabled="!!busy"
            title="更多导出选项"
          >▾</button>
          <div v-if="exportMenuOpen" class="export-menu" @click.stop>
            <button
              class="export-item"
              :disabled="!report || !!busy"
              @click="exportReportFromMenu"
            >
              <b>导出报销单</b>
              <span>当前报销单 Excel，含分类汇总、合计与大写金额</span>
            </button>
            <button class="export-item" :disabled="!!busy" @click="exportEvidenceFromMenu">
              <b>导出证据包（含分类 PDF）</b>
              <span>发票明细 Excel + 二合一打印 PDF + 按公司/分类的 A4 二合一无标注 PDF</span>
            </button>
          </div>
        </div>
      </div>
      <button class="btn primary" @click="openReportModal('create')" :disabled="!!busy">新建报销单</button>
      <button class="btn" @click="poolVisible = !poolVisible" :disabled="!report">
        {{ poolVisible ? '专注报销单' : '显示发票池' }}
      </button>
      <div class="more-menu-wrap">
        <button class="btn" @click.stop="toggleMoreMenu" title="更多功能">
          更多 <span class="caret">▾</span>
        </button>
        <div v-if="moreMenuOpen" class="export-menu more-menu" @click.stop>
          <button class="menu-row" :disabled="!!busy" @click="openDashboardFromMenu">
            <span>汇总看板</span><kbd>Ctrl+D</kbd>
          </button>
          <button class="menu-row" :disabled="!!busy" @click="openRulesFromMenu">
            <span>分类规则</span>
          </button>
          <button class="menu-row" :disabled="!!busy" @click="openBackupFromMenu">
            <span>数据备份…</span>
          </button>
          <button class="menu-row" :disabled="!!busy" @click="openConflictsFromMenu">
            <span>重复票审查…</span>
            <span v-if="boot.conflict_group_count" class="badge warn">{{ boot.conflict_group_count }}</span>
          </button>
          <button class="menu-row" @click="cycleThemeFromMenu">
            <span>外观：{{ themeLabel }}</span><kbd>Ctrl+Shift+D</kbd>
          </button>
          <button class="menu-row" @click="openWelcomeFromMenu">
            <span>首次使用向导</span>
          </button>
          <button class="menu-row" @click="openShortcutsFromMenu">
            <span>快捷键与帮助</span><kbd>F1</kbd>
          </button>
        </div>
      </div>
      <button class="icon-btn topbar-help" @click="openShortcuts" title="快捷键（F1）">?</button>
    </header>

    <div v-if="showUnrecognizedBanner" class="notice-bar">
      <span class="notice-mark">!</span>
      <span class="notice-text">
        有 <b>{{ boot.unrecognized_count }}</b> 张发票未识别（扫描件/图片）。
        本机 OCR 可补识别，约 5 秒/张，不上传。
      </span>
      <span class="spacer"></span>
      <button class="btn primary" :disabled="!!busy" @click="reparseUnrecognized">
        一键重新识别
      </button>
      <button class="icon-btn" title="本次先隐藏" @click="unrecognizedDismissed = true">×</button>
    </div>

    <main
      class="layout"
      :class="{ 'pool-hidden': !poolVisible, 'with-notice': showUnrecognizedBanner }"
    >
      <section class="panel pool" v-show="poolVisible">
        <div class="toolbar">
          <select v-model="filters.batch_id" @change="refreshInvoices(true)" title="按导入批次筛选">
            <option value="">全部批次</option>
            <option v-for="batch in boot.batches" :key="batch.id" :value="batch.id">
              #{{ batch.id }} {{ batch.label || '未命名批次' }}（{{ batch.invoice_count }} 张）
            </option>
          </select>
          <input
            ref="searchInput"
            class="search"
            v-model.trim="filters.search"
            placeholder="搜索票号 / 销售方 / 购买方 / 项目（Ctrl+K）"
            @keyup.enter="refreshInvoices(true)"
          >
          <label class="check"><input type="checkbox" v-model="filters.unlinked_only" @change="refreshInvoices(true)">仅未关联</label>
          <label class="check" title="只看扫描件/图片等未识别的发票"><input type="checkbox" v-model="filters.unrecognized_only" @change="refreshInvoices(true)">仅未识别</label>
          <label class="check"><input type="checkbox" v-model="filters.include_review" @change="refreshInvoices(true)">含待确认</label>
          <input type="date" v-model="filters.date_from" @change="refreshInvoices(true)" title="开票日期起">
          <input type="date" v-model="filters.date_to" @change="refreshInvoices(true)" title="开票日期止">
          <button class="btn ghost" @click="refreshInvoices(false)" :disabled="invoicesLoading">刷新</button>
          <button
            class="btn"
            @click="reparseUnrecognized"
            :disabled="invoicesLoading || !!busy"
            title="对无文本层的图片/扫描发票重新做本地 OCR 识别；不改源文件，跳过已人工修正的记录"
          >重新识别未识别</button>
        </div>

        <div class="summary-bar">
          <span><b>{{ invoiceSummary.count }}</b> 张发票</span>
          <span title="缺失金额的发票不计入合计">合计 <b>¥{{ invoiceSummary.total }}</b></span>
          <button
            v-if="invoiceSummary.review_count"
            class="summary-action"
            title="只列出需要人工核对的发票，逐张确认，支持跳过与撤销"
            @click="openReviewQueue()"
          >待确认 {{ invoiceSummary.review_count }} · 逐个确认</button>
          <span v-if="invoiceSummary.linked_count">已关联 {{ invoiceSummary.linked_count }}</span>
          <span v-if="invoiceSummary.missing_amount_count" class="warn">缺金额 {{ invoiceSummary.missing_amount_count }}</span>
          <span class="spacer"></span>
          <span class="muted">已选 {{ selected.length }} 张</span>
        </div>

        <div class="table-wrap">
          <table class="data-table invoice-table">
            <thead>
              <tr>
                <th class="col-check">
                  <input type="checkbox" :checked="allVisibleSelected" @change="toggleSelectAll" title="全选当前列表">
                </th>
                <th>日期</th>
                <th>票号</th>
                <th title="购买方（发票抬头公司）">公司</th>
                <th>销售方</th>
                <th class="num">金额</th>
                <th>分类</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody>
              <tr
                v-for="row in invoices"
                :key="row.id"
                :class="{ review: row.needs_review, active: preview && preview.invoice.id === row.id }"
                @click="openPreview(row)"
              >
                <td class="col-check" @click.stop>
                  <input type="checkbox" :value="row.id" v-model="selected">
                </td>
                <td class="mono">{{ row.invoice_date || '—' }}</td>
                <td class="mono ellipsis" :title="row.invoice_number">
                  {{ row.invoice_number || '（无票号）' }}
                  <span v-if="!row.source_exists" class="missing" title="源文件不存在">!</span>
                </td>
                <td class="ellipsis" :title="row.buyer_name">{{ row.buyer_name || '—' }}</td>
                <td class="ellipsis" :title="row.seller_name">{{ row.seller_name || '—' }}</td>
                <td class="num mono">{{ row.amount ? '¥' + row.amount : '缺失' }}</td>
                <td class="category-cell" @click.stop>
                  <select
                    v-if="editingCategoryId === row.id"
                    ref="categorySelect"
                    class="category-select"
                    v-model="categoryDraft"
                    @change="commitCategory(row, $event)"
                    @blur="cancelCategoryEdit(row)"
                    @keydown.esc.stop.prevent="cancelCategoryEdit(row)"
                  >
                    <option v-for="name in categoryChoices" :key="name" :value="name">{{ name }}</option>
                  </select>
                  <button
                    v-else
                    class="tag clickable-tag"
                    title="点击修改分类"
                    @click="startCategoryEdit(row)"
                  >{{ row.category }}</button>
                </td>
                <td class="status-cell">
                  <span v-if="row.needs_review" class="badge warn">待确认</span>
                  <span
                    v-if="row.warning_text && row.warning_text.includes('OCR')"
                    class="badge soft"
                    title="票面无文本层，字段由本地 OCR 识别，请核对"
                  >OCR</span>
                  <span v-if="row.edit_count" class="badge soft" :title="'人工修正 ' + row.edit_count + ' 项'">已修正</span>
                  <span v-if="row.category_rule === 'learned.seller'" class="badge soft" title="分类来自已学习的销售方规则">规则分类</span>
                  <span v-if="row.linked" class="badge linked" :title="row.links.map(l => '#' + l.report_id + ' ' + l.month).join('，')">已关联</span>
                  <span v-if="row.confidence_notes" class="badge soft" :title="row.confidence_notes">低置信</span>
                </td>
              </tr>
            </tbody>
          </table>
          <div v-if="!invoices.length && !invoicesLoading" class="empty">没有匹配的发票</div>
          <div v-if="invoicesLoading" class="empty">正在加载…</div>
        </div>

        <div class="pool-actions">
          <input v-model.trim="quickProject" class="project-input" placeholder="生成行的项目名称（可选）">
          <button
            class="btn primary"
            :disabled="!currentReportId || !selected.length || !!busy"
            @click="addSelectedInvoices"
          >从所选生成报销行（{{ selected.length }}）</button>
          <button
            class="btn"
            :disabled="!activeLine || !selected.length || !!busy"
            @click="linkToActiveLine"
          >关联到第 {{ activeLine ? activeLine.sequence : '—' }} 行</button>
        </div>
      </section>

      <section class="panel report">
        <div class="report-head">
          <select v-model="currentReportId" @change="loadReport" title="切换报销单">
            <option disabled value="">选择报销单</option>
            <option v-for="item in reports" :key="item.id" :value="item.id">
              #{{ item.id }} · {{ item.month }} · {{ item.company }} / {{ item.reporter }}
            </option>
          </select>
          <button class="btn ghost" :disabled="!report" @click="openReportModal('edit')">编辑表头</button>
          <span class="spacer"></span>
          <template v-if="report">
            <span class="total" title="按报销行金额整数分合计">合计 <b>¥{{ report.amount }}</b></span>
            <select v-model="layout" title="导出模板">
              <option v-for="item in boot.layouts" :key="item.key" :value="item.key">{{ item.label }}</option>
            </select>
            <button class="btn primary" :disabled="!!busy" @click="exportReport">导出报销单</button>
          </template>
        </div>

        <div v-if="!report" class="empty report-empty">
          <div>还没有选中报销单</div>
          <button class="btn primary" @click="openReportModal('create')">新建报销单</button>
        </div>

        <template v-else>
          <div class="report-meta">
            <div class="report-title">{{ report.title }}</div>
            <div class="muted">
              {{ report.company }} · {{ report.department || '未填部门' }} · {{ report.reporter }} · {{ report.month }}
              <span v-if="report.note"> · {{ report.note }}</span>
            </div>
            <div class="report-stats">
              <span>{{ lines.length }} 行</span>
              <span v-if="mismatchCount" class="warn">{{ mismatchCount }} 行金额与发票合计不一致</span>
              <span v-if="unlinkedCount" class="warn">{{ unlinkedCount }} 行标记有票但未关联</span>
            </div>
          </div>

          <div class="table-wrap lines-wrap">
            <table class="data-table line-table">
              <thead>
                <tr>
                  <th class="col-seq">#</th>
                  <th class="col-date">日期</th>
                  <th class="col-category">费用名称</th>
                  <th class="col-amount">金额</th>
                  <th class="col-invoice">有票 / 附注</th>
                  <th class="col-project">项目名称</th>
                  <th class="col-note">备注（报销费用说明）</th>
                  <th class="col-links">关联发票</th>
                  <th class="col-ops"></th>
                </tr>
              </thead>
              <tbody>
                <tr
                  v-for="line in lines"
                  :key="line.id"
                  :class="{ active: activeSequence === line.sequence, mismatch: line.amount_mismatch }"
                  @click="activeSequence = line.sequence"
                >
                  <td class="col-seq num">{{ line.sequence }}</td>
                  <td><input type="date" v-model="line.line_date" @change="saveLine(line)"></td>
                  <td><input v-model="line.category" list="category-options" @change="saveLine(line)"></td>
                  <td><input class="num-input" inputmode="decimal" v-model="line.amount" @change="saveLine(line)"></td>
                  <td class="invoice-cell">
                    <label class="check"><input type="checkbox" v-model="line.has_invoice" @change="saveLine(line)">有票</label>
                    <input class="note-input" v-model="line.invoice_note" placeholder="附注" @change="saveLine(line)">
                  </td>
                  <td><input v-model="line.project_name" @change="saveLine(line)"></td>
                  <td><input v-model="line.description" @change="saveLine(line)"></td>
                  <td>
                    <span v-if="line.invoices.length" class="chips">
                      <span
                        v-for="inv in line.invoices"
                        :key="inv.id"
                        class="chip"
                        :title="inv.invoice_number + ' · ' + (inv.amount ? '¥' + inv.amount : '缺金额')"
                      >
                        #{{ inv.id }} ¥{{ inv.amount || '?' }}
                        <button class="chip-x" @click.stop="unlinkInvoice(line, inv.id)" title="取消关联">×</button>
                      </span>
                    </span>
                    <span v-else class="muted">—</span>
                  </td>
                  <td class="col-ops">
                    <button class="icon-btn danger-text" @click.stop="removeLine(line)" title="删除本行">删除</button>
                  </td>
                </tr>
              </tbody>
            </table>
            <div v-if="!lines.length" class="empty">这张报销单还没有行。勾选左侧发票生成，或新增手动行。</div>
          </div>

          <div class="line-actions">
            <button class="btn" @click="addBlankLine" :disabled="!!busy">+ 新增行</button>
            <button class="btn" @click="openMileageModal" :disabled="!!busy">+ 里程行</button>
            <span v-if="activeLine" class="hint">当前行 #{{ activeLine.sequence }} · {{ activeLine.category }}</span>
            <span class="spacer"></span>
            <span v-if="report.note" class="muted">{{ report.note }}</span>
          </div>
        </template>
      </section>
    </main>

    <aside class="preview-drawer" v-if="preview">
      <div class="preview-head">
        <div>
          <div class="preview-title">发票 #{{ preview.invoice.id }}</div>
          <div class="muted">
            {{ preview.invoice.type_label }} · {{ preview.pageLabel }}
            <span class="preview-nav-hint" title="按 ↑/↓ 切换上一张/下一张发票">↑/↓ 切换</span>
          </div>
        </div>
        <span class="spacer"></span>
        <button class="icon-btn" @click="changeZoom(-0.25)" title="缩小">－</button>
        <button class="icon-btn" @click="changeZoom(0.25)" title="放大">＋</button>
        <button class="icon-btn" @click="closePreview" title="关闭">×</button>
      </div>
      <div v-if="reviewQueue" class="review-bar">
        <span class="badge warn">待确认队列</span>
        <b v-if="reviewQueue.length">{{ reviewPosition }} / {{ reviewQueue.length }}</b>
        <span v-else class="badge linked">全部确认完成</span>
        <span
          v-if="reviewQueue.length"
          class="review-reason ellipsis"
          :title="reviewReason(preview.invoice)"
        >{{ reviewReason(preview.invoice) }}</span>
        <span class="spacer"></span>
        <button
          class="btn ghost"
          :disabled="!reviewQueue.length || previewSaving || !!busy"
          title="先不确认，直接看下一张"
          @click="skipReview"
        >跳过</button>
        <button
          class="btn ghost"
          :disabled="!reviewConfirmed.length || reviewSaving || !!busy"
          title="把上一张已确认的发票放回队列"
          @click="undoReview"
        >撤销确认</button>
        <button class="icon-btn" @click="exitReviewQueue" title="退出队列">×</button>
      </div>
      <div class="preview-fields" v-if="previewForm">
        <div>
          <span class="label">票号</span>
          <input class="mono" v-model="previewForm.invoice_number">
        </div>
        <div>
          <span class="label">日期</span>
          <input type="date" v-model="previewForm.invoice_date">
        </div>
        <div class="wide">
          <span class="label">销售方</span>
          <input v-model="previewForm.seller_name">
        </div>
        <div class="wide">
          <span class="label">购买方</span>
          <input v-model="previewForm.buyer_name">
        </div>
        <div>
          <span class="label">金额</span>
          <input class="mono" inputmode="decimal" v-model="previewForm.amount">
        </div>
        <div>
          <span class="label">分类</span>
          <input list="category-options" v-model="previewForm.category">
        </div>
        <div class="wide">
          <span class="label">项目</span>
          <input v-model="previewForm.item_summary">
        </div>
        <div class="wide muted">
          票型 {{ preview.invoice.type_label }} · 来源 {{ preview.invoice.source_name }} ·
          第 {{ preview.pageLabel }} 页 · {{ preview.invoice.batch_label }}
        </div>
        <div v-if="preview.invoice.category_rule === 'learned.seller'" class="wide">
          <span class="badge soft">规则分类</span>
          <span class="muted">分类由销售方规则自动套用；修正后会更新该规则。</span>
        </div>
        <div v-if="preview.invoice.confidence_notes" class="wide warn">低置信字段：{{ preview.invoice.confidence_notes }}</div>
        <div v-if="preview.invoice.warning_text" class="wide warn">识别警告：{{ preview.invoice.warning_text }}</div>
      </div>
      <div class="preview-save">
        <button
          class="btn primary"
          :disabled="!previewDirty || previewSaving || !!busy"
          @click="saveInvoiceEdits"
        >保存修正</button>
        <button
          v-if="preview.invoice.needs_review"
          class="btn"
          :disabled="previewDirty || previewSaving || !!busy"
          title="确认已人工核对；识别警告与低置信记录仍会保留"
          @click="confirmInvoice"
        >确认无误</button>
        <span v-if="previewDirty" class="warn">未保存</span>
        <span class="spacer"></span>
        <span class="muted">只改本地数据，不动源文件</span>
      </div>
      <div class="edit-history" v-if="invoiceEdits.length">
        <div class="history-title">修正记录</div>
        <div class="history-row" v-for="edit in invoiceEdits" :key="edit.id">
          <span class="muted mono">{{ formatTime(edit.edited_at) }}</span>
          <span class="history-field">{{ fieldLabels[edit.field] || edit.field }}</span>
          <span
            class="history-change ellipsis"
            :title="(edit.old_value || '空') + ' → ' + (edit.new_value || '空')"
          >{{ edit.old_value || '空' }} → {{ edit.new_value || '空' }}</span>
        </div>
      </div>
      <div class="preview-actions">
        <button
          class="btn primary"
          :disabled="!activeLine || !currentReportId || !!busy"
          @click="linkPreviewToActiveLine"
        >关联到第 {{ activeLine ? activeLine.sequence : '—' }} 行</button>
        <button
          class="btn"
          :disabled="!currentReportId || !!busy"
          @click="addPreviewInvoice"
        >生成新报销行</button>
      </div>
      <div class="preview-image">
        <div v-if="preview.loading" class="empty">正在渲染票面…</div>
        <div v-else-if="preview.error" class="empty warn">{{ preview.error }}</div>
        <img v-else :src="preview.data_url" alt="发票票面">
      </div>
    </aside>

    <div v-if="busy" class="busy-overlay">
      <div class="spinner"></div>
      <div>{{ busy }}</div>
      <div v-if="importProgress.active" class="import-progress">
        <div class="progress-track">
          <div class="progress-fill" :style="{ width: importPercent + '%' }"></div>
        </div>
        <div class="muted">{{ importStageText }}</div>
        <div v-if="importProgress.name" class="muted progress-name">{{ importProgress.name }}</div>
        <button class="btn" :disabled="importProgress.cancelling" @click="cancelImport">

          <div class="form-grid">
            <label class="wide">发票文件夹 *
              <div class="folder-input">
                <input v-model.trim="wizard.folder" placeholder="D:\发票\2026-10">
                <button class="btn" type="button" :disabled="pickingWizardFolder" @click="pickWizardFolder">
                  {{ pickingWizardFolder ? '选择中…' : '浏览…' }}
                </button>
              </div>
            </label>
            <label>报账月份 *<input type="month" v-model="wizard.month"></label>
            <label>批次名称<input v-model.trim="wizard.label" placeholder="可选，默认用文件夹名"></label>
          </div>
          <div v-if="boot.recent_import_paths.length" class="recent-paths">
            <div class="recent-title">最近用过的文件夹（点击填入）</div>
            <button
              v-for="path in boot.recent_import_paths.slice(0, 4)"
              :key="'wizard-' + path"
              type="button"
              class="recent-path"
              :class="{ active: wizard.folder === path }"
              :title="path"
              @click="wizard.folder = path"
            >
              <b>{{ folderName(path) }}</b><span>{{ path }}</span>
            </button>
          </div>
          <p class="muted">已导入过的文件会自动跳过；图片发票用本机 OCR 补识别，不上传。</p>
          <div class="modal-actions">
            <button class="btn" @click="closeWizard">稍后再说</button>
            <button v-if="wizard.importResult" class="btn" @click="wizardNext(2)">下一步：核对</button>
            <button
              class="btn primary"
              :disabled="wizardBusy || !!busy || !wizard.folder"
              @click="wizardImport"
            >{{ wizard.importResult ? '重新导入' : '开始导入' }}</button>
          </div>
        </section>

        <!-- Step 2: review queue -->
        <section v-else-if="wizardStep === 2" class="wizard-body">
          <div v-if="wizardStats.loading" class="empty">正在统计…</div>
          <template v-else>
            <div class="dash-tiles">
              <div class="dash-tile" :class="{ warn: wizardStats.review_count }">
                <span class="dash-tile-label">待确认</span><b>{{ wizardStats.review_count }}</b>
              </div>
              <div class="dash-tile">
                <span class="dash-tile-label">本批次发票</span><b>{{ wizardStats.count }}</b>
              </div>
              <div class="dash-tile">
                <span class="dash-tile-label">合计</span><b>¥{{ wizardStats.total }}</b>
              </div>
              <div class="dash-tile" :class="{ warn: wizardStats.missing_amount_count }">
                <span class="dash-tile-label">缺金额</span><b>{{ wizardStats.missing_amount_count }}</b>
              </div>
            </div>
            <p v-if="wizardStats.review_count" class="muted">
              逐张核对票面：点「确认无误」后自动下一张；拿不准就跳过，回头再处理。
              撤销确认可把上一张放回队列。
            </p>
            <p v-else class="muted">本批次没有待确认的发票，可以直接进入下一步。</p>
          </template>
          <div class="modal-actions">
            <button class="btn" @click="wizardGo(1)">上一步</button>
            <button class="btn" :disabled="wizardStats.loading" @click="wizardRefreshStats">刷新</button>
            <button
              class="btn primary"
              :disabled="!wizardStats.review_count || wizardBusy"
              @click="wizardStartReview"
            >逐个确认（{{ wizardStats.review_count }}）</button>
            <button class="btn" @click="wizardNext(3)">下一步：分类</button>
          </div>
        </section>

        <!-- Step 3: categories -->
        <section v-else-if="wizardStep === 3" class="wizard-body">
          <p class="muted">
            按分类核对金额。要改分类：在左侧发票池点分类标签，或打开某张发票修改；
            改完点「刷新」。
          </p>
          <div v-if="wizardStats.loading" class="empty">正在统计…</div>
          <div v-else-if="!wizardStats.categories.length" class="empty">本批次没有分类数据。</div>
          <div v-else class="wizard-cats">
            <table class="data-table">
              <thead>
                <tr><th>分类</th><th class="num">张数</th><th class="num">金额</th></tr>
              </thead>
              <tbody>
                <tr v-for="item in wizardStats.categories" :key="item.category">
                  <td>{{ item.category }}</td>
                  <td class="num">{{ item.count }}</td>
                  <td class="num mono">¥{{ item.total }}</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="modal-actions">
            <button class="btn" @click="wizardGo(2)">上一步</button>
            <button class="btn" :disabled="wizardStats.loading" @click="wizardRefreshStats">刷新</button>
            <button class="btn primary" @click="wizardNext(4)">下一步：生成报销单</button>
          </div>
        </section>

        <!-- Step 4: create the report from the batch -->
        <section v-else-if="wizardStep === 4" class="wizard-body">
          <template v-if="!wizard.reportId">
            <div class="form-grid">
              <label>公司 *<input v-model.trim="wizard.reportForm.company" list="company-options" placeholder="如：示例甲"></label>
              <label>报销人 *<input v-model.trim="wizard.reportForm.reporter" list="reporter-options" placeholder="姓名"></label>
              <label>部门<input v-model.trim="wizard.reportForm.department" list="department-options" placeholder="可选"></label>
              <label>月份 *<input type="month" v-model="wizard.reportForm.month"></label>
              <label class="wide">标题<input v-model.trim="wizard.reportForm.title" placeholder="留空则自动生成"></label>
            </div>
            <p class="muted">
              将把本批次 {{ wizardStats.unlinked_ids.length }} 张未关联发票各生成一行；
              缺金额、缺日期、已关联的会跳过。
            </p>
            <div class="modal-actions">
              <button class="btn" @click="wizardGo(3)">上一步</button>
              <button
                class="btn primary"
                :disabled="wizardBusy || !!busy || !wizard.reportForm.company || !wizard.reportForm.reporter || !wizard.reportForm.month"
                @click="wizardCreateReport"
              >{{ wizardBusy ? '正在生成…' : '生成报销单' }}</button>
            </div>
          </template>
          <template v-else>
            <p>
              报销单已生成：<b>{{ wizard.reportSummary }}</b>，新增
              <b>{{ wizard.addedCount }}</b> 行。
            </p>
            <p v-if="wizard.skipped" class="muted">
              跳过 {{ wizard.skipped.skipped }} 张：已关联 {{ wizard.skipped.skipped_linked }}、
              缺金额 {{ wizard.skipped.skipped_missing_amount }}、
              缺日期 {{ wizard.skipped.skipped_missing_date }}。
            </p>
            <div class="modal-actions">
              <button class="btn" @click="wizardGo(3)">返回分类</button>
              <button class="btn primary" @click="wizardNext(5)">下一步：导出</button>
            </div>
          </template>
        </section>

        <!-- Step 5: export -->
        <section v-else class="wizard-body">
          <p class="muted">报销单和证据包都只写本机 out 目录，源发票不动。</p>
          <div class="wizard-export">
            <button class="btn primary" :disabled="!wizard.reportId || !!busy" @click="wizardExportReport">
              导出报销单 Excel
            </button>
            <button class="btn" :disabled="wizard.batchId == null || !!busy" @click="wizardExportEvidence">
              导出证据包（含分类 PDF）
            </button>
          </div>
          <p class="muted">导出完成后会列出文件位置，可直接打开文件夹。</p>
          <div class="modal-actions">
            <button class="btn" @click="closeWizard">完成</button>
          </div>
        </section>
      </div>
    </div>

    <!-- Export result modal: stays open until the user has found the files -->
    <div v-if="exportResult" class="modal-backdrop" @click.self="exportResult = null">
      <div class="modal">
        <h2>{{ exportResult.title }}</h2>
        <p>{{ exportResult.summary }}</p>
        <ul class="export-paths">
          <li v-for="item in exportResult.items" :key="item.path">
            <div class="muted">{{ item.label }}</div>
            <code>{{ item.path }}</code>
          </li>
        </ul>
        <div v-if="exportResult.groups && exportResult.groups.length" class="export-groups">
          <div class="export-groups-title muted">按公司 / 分类拆分的 PDF（A4 二合一，无标注）</div>
          <div class="export-group-row" v-for="group in exportResult.groups" :key="group.path">
            <span class="ellipsis" :title="group.path">{{ group.company }} / {{ group.category }}</span>
            <span class="muted">{{ group.count }} 张 · {{ group.pages }} 页 A4</span>
          </div>
        </div>
        <p v-if="exportResult.note" class="muted">{{ exportResult.note }}</p>
        <div class="modal-actions">
          <button class="btn primary" :disabled="!!busy" @click="openExportFolder">
            打开文件夹
          </button>
          <button class="btn" @click="exportResult = null">关闭</button>
        </div>
      </div>
    </div>

    <!-- Summary dashboard -->
    <div v-if="showDashboardModal" class="modal-backdrop" @click.self="showDashboardModal = false">
      <div class="modal dashboard-modal">
        <div class="dashboard-head">
          <div>
            <h2>汇总看板</h2>
            <p class="muted">与左侧发票池当前筛选同一口径；金额来自本地解析结果。</p>
          </div>
          <span class="spacer"></span>
          <button class="btn ghost" @click="loadDashboard" :disabled="dashboardLoading">刷新</button>
          <button class="icon-btn" @click="showDashboardModal = false" title="关闭">×</button>
        </div>
        <div v-if="dashboardLoading" class="empty">正在汇总…</div>
        <template v-else-if="dashboard">
          <div class="dash-hero">
            <div class="dash-hero-label">发票合计</div>
            <div class="dash-hero-value">¥{{ dashboard.total }}</div>
            <div class="muted">
              {{ dashboard.count }} 张 · 已关联 {{ dashboard.linked_count }} 张
              <span v-if="dashboard.missing_amount_count">
                · 缺金额 {{ dashboard.missing_amount_count }} 张不计入合计
              </span>
            </div>
          </div>
          <div class="dash-tiles">
            <div class="dash-tile" :class="{ warn: dashboard.review_count }">
              <span class="dash-tile-label">待确认</span><b>{{ dashboard.review_count }}</b>
            </div>
            <div class="dash-tile" :class="{ warn: dashboard.low_confidence_count }">
              <span class="dash-tile-label">低置信</span><b>{{ dashboard.low_confidence_count }}</b>
            </div>
            <div class="dash-tile" :class="{ warn: dashboard.missing_amount_count }">
              <span class="dash-tile-label">缺金额</span><b>{{ dashboard.missing_amount_count }}</b>
            </div>
            <div class="dash-tile" :class="{ warn: dashboard.missing_source_count }">
              <span class="dash-tile-label">缺源文件</span><b>{{ dashboard.missing_source_count }}</b>
            </div>
            <div class="dash-tile">
              <span class="dash-tile-label">未关联</span>
              <b>{{ dashboard.count - dashboard.linked_count }}</b>
            </div>
            <div class="dash-tile">
              <span class="dash-tile-label">已修正</span><b>{{ dashboard.edited_count }}</b>
            </div>
          </div>
          <div class="dash-columns">
            <section>
              <h3>分类分布</h3>
              <div v-if="dashboard.categories.length" class="bar-list">
                <div
                  v-for="item in dashboard.categories"
                  :key="item.category"
                  class="bar-row"
                  :title="item.category + '：' + item.count + ' 张，¥' + item.total"
                >
                  <span class="bar-label" :title="item.category">{{ item.category }}</span>
                  <span class="bar-track">
                    <span class="bar-fill" :style="{ width: barPercent(item.total_cents, categoryMax) }"></span>
                  </span>
                  <span class="bar-value mono">¥{{ item.total }}</span>
                </div>
              </div>
              <div v-else class="empty">没有分类数据</div>
            </section>
            <section>
              <h3>月度分布</h3>
              <div v-if="dashboard.months.length" class="bar-list">
                <div
                  v-for="item in dashboard.months"
                  :key="item.month"
                  class="bar-row"
                  :title="item.month + '：' + item.count + ' 张，¥' + item.total"
                >
                  <span class="bar-label mono" :title="item.month">{{ item.month }}</span>
                  <span class="bar-track">
                    <span class="bar-fill" :style="{ width: barPercent(item.total_cents, monthMax) }"></span>
                  </span>
                  <span class="bar-value mono">¥{{ item.total }}</span>
                </div>
              </div>
              <div v-else class="empty">没有日期数据</div>
            </section>
          </div>
          <div class="dash-report" v-if="report">
            <h3>当前报销单</h3>
            <div class="muted">{{ report.title }} · {{ lines.length }} 行 · 合计 ¥{{ report.amount }}</div>
            <div v-if="mismatchCount || unlinkedCount" class="warn">
              <span v-if="mismatchCount">{{ mismatchCount }} 行金额与发票合计不一致</span>
              <span v-if="unlinkedCount"> · {{ unlinkedCount }} 行有票但未关联</span>
            </div>
          </div>
        </template>
        <div v-else class="empty">暂无汇总数据</div>
        <div class="modal-actions">
          <span class="muted">快捷键 F1 查看帮助</span>
          <span class="spacer"></span>
          <button class="btn" @click="showDashboardModal = false">关闭</button>
        </div>
      </div>
    </div>

    <!-- Keyboard shortcuts -->
    <div v-if="showShortcutsModal" class="modal-backdrop" @click.self="showShortcutsModal = false">
      <div class="modal shortcuts-modal">
        <h2>快捷键</h2>
        <table class="shortcut-table">
          <tbody>
            <tr><td><kbd>Ctrl</kbd> + <kbd>K</kbd></td><td>定位到发票搜索</td></tr>
            <tr><td><kbd>Ctrl</kbd> + <kbd>I</kbd></td><td>导入发票</td></tr>
            <tr><td><kbd>Ctrl</kbd> + <kbd>E</kbd></td><td>导出当前报销单</td></tr>
            <tr><td><kbd>Ctrl</kbd> + <kbd>B</kbd></td><td>显示 / 隐藏发票池</td></tr>
            <tr><td><kbd>Ctrl</kbd> + <kbd>D</kbd></td><td>打开汇总看板</td></tr>
            <tr><td><kbd>Ctrl</kbd> + <kbd>Enter</kbd></td><td>保存票面修正</td></tr>
            <tr><td><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>D</kbd></td><td>切换外观：自动 / 浅色 / 深色</td></tr>
            <tr><td><kbd>↑</kbd> / <kbd>↓</kbd></td><td>预览打开时切换上一张 / 下一张发票（“确认无误”后自动下一张）</td></tr>
            <tr><td><kbd>F1</kbd></td><td>打开本帮助</td></tr>
            <tr><td><kbd>Esc</kbd></td><td>关闭弹窗或票面预览</td></tr>
          </tbody>
        </table>
        <p class="muted">外观只影响本机界面，不写入发票数据；自动模式跟随系统设置。</p>
        <div class="modal-actions">
          <button class="btn primary" @click="showShortcutsModal = false">知道了</button>
        </div>
      </div>
    </div>

    <datalist id="category-options">
      <option v-for="name in boot.categories" :key="name" :value="name"></option>
    </datalist>
    <datalist id="company-options">
      <option v-for="name in boot.report_choices.company" :key="name" :value="name"></option>
    </datalist>
    <datalist id="department-options">
      <option v-for="name in boot.report_choices.department" :key="name" :value="name"></option>
    </datalist>
    <datalist id="reporter-options">
      <option v-for="name in boot.report_choices.reporter" :key="name" :value="name"></option>
    </datalist>
  </template>
</div>

<script src="vendor/vue.global.prod.js"></script>
<script src="app.js"></script>
</body>
</html>
