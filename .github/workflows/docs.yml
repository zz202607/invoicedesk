name: Docs checks

# Docs-only changes must not consume the 2x-billed Windows runner. This job
# keeps the documentation budget, privacy and ignore-rule guards; the code
# suite still runs for any app/tests/tools change in ci.yml.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "docs/**"
      - "*.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs hygiene (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install "pytest>=8,<10"

      - name: Run documentation checks
        run: python -m pytest -q tests/test_project_hygiene.py
